<!-- navbar -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Titanic — All in One Store{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>

<nav class="navbar">
    <div class="logo">
        <span class="logo-text">TITAN<span class="logo-accent">IC<span class="logo-dot"></span></span></span>
    </div>

    <div class="search-bar">
        <input type="text" placeholder="Search products...">
        <button class="search-btn"><i class="ti ti-search"></i></button>
    </div>

    <div class="nav-actions">
        <div class="agent-btn">
            <i class="ti ti-users-plus"></i>
            <span>Join as Agent</span>
        </div>

        <div class="nav-divider"></div>

        <a href="#" class="nav-icon-btn">
            <i class="ti ti-user"></i>
        </a>

        <a href="{% url 'view_cart' %}" class="nav-icon-btn">
            <i class="ti ti-shopping-cart"></i>
            <!-- <span class="cart-badge">{{ request.session.cart|length }}</span> -->
            <span class="cart-badge" id="cart-badge">{{ request.session.cart|length }}</span>
        </a>
    </div>
</nav>  


<div class="category-bar">
    <div class="cat-all">
        <i class="ti ti-menu-2"></i>
        <span>All</span>
    </div>
    <a href="#" class="cat-link">FMCG</a>
    <a href="#" class="cat-link">Groceries</a>
    <a href="#" class="cat-link active">Electronics</a>
    <a href="#" class="cat-link">Electrical</a>
</div>

<div id="toast" class="toast"></div>

    {% block content %}
    {% endblock %}

    <footer class="site-footer">
        <p>&copy; 2026 Titanic — All in One Store, Jaisalmer</p>
    </footer>


<script>
document.addEventListener('click', function (e) {
    const link = e.target.closest('.add-btn, .step-btn');
    if (!link || !link.closest('.cart-control')) return;
    e.preventDefault();

    fetch(link.href, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
        .then(res => res.json())
        .then(data => {
            const control = link.closest('.cart-control');
            if (data.quantity > 0) {
                control.innerHTML = `
                    <div class="stepper">
                        <a href="/cart/decrease/${control.dataset.productId}/" class="step-btn dec">−</a>
                        <span class="qty-val">${data.quantity}</span>
                        <a href="/cart/increase/${control.dataset.productId}/" class="step-btn inc">+</a>
                    </div>`;
            } else {
                control.innerHTML = `<a href="/cart/add/${control.dataset.productId}/" class="add-btn">Add to cart</a>`;
            }
            document.getElementById('cart-badge').textContent = data.cart_count;

            const toast = document.getElementById('toast');
            toast.textContent = 'Product added to cart';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1800);
        });
});
</script>
</body>
</html>

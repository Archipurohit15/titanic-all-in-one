{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'customers/auth.css' %}">
<link rel="stylesheet" href="{% static 'css/auth-status.css' %}">

<div class="auth-status-wrap">
    <div class="auth-status-card">
        <div class="auth-status-icon">
            <i class="ti ti-circle-check"></i>
        </div>
        <h2>Password Changed!</h2>
        <p>Tumhara password successfully change ho gaya hai. Ab naye password se login kar sakti ho.</p>
        <a href="{% url 'customer_login' %}" class="login-toggle-btn">
            <i class="ti ti-login"></i> Login Karo
        </a>
    </div>
</div>
{% endblock %}

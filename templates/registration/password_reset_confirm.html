{% extends 'base.html' %}
{% block content %}
<div style="max-width:420px; margin:60px auto; padding:32px; background:#fff; border:1px solid var(--brand-border); border-radius:14px;">
    <h2 style="font-family:'Poppins',sans-serif; color:var(--brand-text-dark);">Naya Password Set Karo</h2>
    {% if validlink %}
    <form method="POST">
        {% csrf_token %}
        {{ form.new_password1 }}
        {{ form.new_password2 }}
        <button type="submit" class="hero-cta" style="width:100%; margin-top:16px;">Save Password</button>
    </form>
    {% else %}
    <p>Ye link expire ho chuka hai ya invalid hai.</p>
    {% endif %}
</div>
{% endblock %}

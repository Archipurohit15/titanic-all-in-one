{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'customers/auth.css' %}">
<link rel="stylesheet" href="{% static 'css/auth-status.css' %}">

<div class="auth-status-wrap">
    <div class="auth-status-card">
        <div class="auth-status-icon">
            <i class="ti ti-mail-forward"></i>
        </div>
        <h2>Check Your Inbox</h2>
        <p>Agar ye email registered hai, reset link bhej diya gaya hai. Apna inbox (aur spam folder bhi) check karo.</p>
        <a href="{% url 'customer_login' %}" class="login-toggle-btn">
            <i class="ti ti-arrow-left"></i> Back to Login
        </a>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block content %}
<div style="max-width:420px; margin:60px auto; padding:32px; background:#fff; border:1px solid var(--brand-border); border-radius:14px;">
    <h2 style="font-family:'Poppins',sans-serif; color:var(--brand-text-dark); margin-bottom:8px;">Password Reset</h2>
    <p style="font-size:13px; color:#9A8A7C; margin-bottom:20px;">Apna email daalo, reset link bhej denge.</p>
    <form method="POST">
        {% csrf_token %}
        {{ form.email }}
        <button type="submit" class="hero-cta" style="width:100%; margin-top:16px;">Send Reset Link</button>
    </form>
</div>
{% endblock %}
